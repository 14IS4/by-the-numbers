version: 2

models:
  - name: stg_flights
    description: One row per scheduled domestic flight from the BTS Reporting Carrier On-Time Performance files.
    columns:
      - name: flight_date
        data_tests: [not_null]
      - name: airline_code
        data_tests: [not_null]
      - name: origin_airport
        data_tests: [not_null]
      - name: dest_airport
        data_tests: [not_null]
      - name: is_cancelled
        data_tests: [not_null]
      - name: cancellation_code
        description: A carrier, B weather, C national air system, D security. Null when not cancelled.
        data_tests:
          - accepted_values:
              arguments:
                values: ["A", "B", "C", "D"]
